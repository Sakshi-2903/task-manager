name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m venv .venv
      - run: ./.venv/bin/python -m pip install --upgrade pip setuptools wheel
      - run: ./.venv/bin/python -m pip install -r requirements-dev.txt
      - run: ./.venv/bin/python -m ruff check .
      - run: ./.venv/bin/python -m pytest --cov=app --cov-report=term-missing --cov-report=xml

  publish:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      owner: ${{ steps.tag.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: |
          echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend
        run: |
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            --file "$GITHUB_WORKSPACE/backend/Dockerfile" \
            --tag ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/taskmanager-backend:${{ steps.tag.outputs.value }} \
            --tag ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/taskmanager-backend:latest \
            --push \
            ./backend

      - name: Push frontend
        run: |
          cd frontend
          npm ci
          npm run build
          test -d dist
          docker buildx build \
            --platform ${{ env.PLATFORMS }} \
            --file "$GITHUB_WORKSPACE/frontend/Dockerfile" \
            --tag ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/taskmanager-frontend:${{ steps.tag.outputs.value }} \
            --tag ${{ env.REGISTRY }}/${{ steps.tag.outputs.owner }}/taskmanager-frontend:latest \
            --push \
            .

  verify:
    name: Deploy to throwaway cluster
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k3d and kustomize
        run: |
          curl -sL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin

      - name: Create cluster
        run: k3d cluster create --config k8s/k3d-cluster.yaml

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load the images that were just published
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          OWNER: ${{ needs.publish.outputs.owner }}
        run: |
          for service in backend frontend; do
            image="$REGISTRY/$OWNER/taskmanager-$service:$TAG"
            docker pull --platform linux/amd64 "$image"
            docker tag "$image" "taskmanager-$service:dev"
          done
          k3d image import taskmanager-backend:dev taskmanager-frontend:dev -c taskmanager

      - name: Apply manifests
        run: |
          kubectl apply -k k8s/overlays/local
          kubectl -n taskmanager rollout status statefulset/mongo --timeout=180s
          kubectl -n taskmanager rollout status deploy/backend --timeout=180s
          kubectl -n taskmanager rollout status deploy/frontend --timeout=120s

      - name: Wait for ingress and pods
        run: |
          for attempt in $(seq 1 30); do
            kubectl -n taskmanager get pods >/dev/null 2>&1 || true
            ready=$(kubectl -n taskmanager get pods -o jsonpath='{range .items[*]}{.metadata.name}:{.status.phase}:{range .status.containerStatuses[*]}{.ready}{","}{end}{"\n"}{end}' 2>/dev/null | grep -E 'backend|frontend|mongo' || true)
            if echo "$ready" | grep -q 'Running:true'; then
              break
            fi
            sleep 2
          done

      - name: Smoke test through the ingress
        run: |
          host="tasks.127.0.0.1.nip.io"
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $host" http://localhost:8081/api/tasks || true)
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done
          [ "$code" = "200" ] || { echo "ingress never became healthy"; exit 1; }

          created=$(curl -s -H "Host: $host" -H 'Content-Type: application/json' \
            -d '{"title":"ci smoke test"}' http://localhost:8081/api/tasks)
          echo "$created" | grep -q '"title": *"ci smoke test"' \
            || { echo "create failed: $created"; exit 1; }

      - name: Assert the rolling update drops no requests
        run: |
          host="tasks.127.0.0.1.nip.io"
          ( for _ in $(seq 1 400); do
              curl -s -o /dev/null -w '%{http_code}\n' -H "Host: $host" \
                http://localhost:8081/api/tasks || echo 000
              sleep 0.25
            done ) > /tmp/codes.txt &
          loop=$!

          sleep 3
          kubectl -n taskmanager rollout restart deploy/backend
          kubectl -n taskmanager rollout status deploy/backend --timeout=180s
          sleep 3
          kill "$loop" 2>/dev/null || true

          total=$(wc -l < /tmp/codes.txt)
          failed=$(grep -cv '^200$' /tmp/codes.txt || true)
          echo "$failed non-200 responses out of $total during the rollout"
          [ "$failed" -eq 0 ] || { sort /tmp/codes.txt | uniq -c; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n taskmanager get pods -o wide
          kubectl -n taskmanager describe pods
          kubectl -n taskmanager logs -l app.kubernetes.io/name=backend --tail=100 --prefix || true
          kubectl -n taskmanager get events --sort-by=.lastTimestamp | tail -40

  deploy:
    name: Deploy to production
    needs: [publish, verify]
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin

      - name: Configure cluster access
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Pin the overlay to this commit's images
        working-directory: k8s/overlays/prod
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          OWNER: ${{ needs.publish.outputs.owner }}
        run: |
          kustomize edit set image \
            "taskmanager-backend=$REGISTRY/$OWNER/taskmanager-backend:$TAG" \
            "taskmanager-frontend=$REGISTRY/$OWNER/taskmanager-frontend:$TAG"

      - name: Apply
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for the rollout, and undo it if it stalls
        run: |
          if ! kubectl -n taskmanager rollout status deploy/backend --timeout=180s; then
            echo "::error::backend rollout failed, rolling back"
            kubectl -n taskmanager rollout undo deploy/backend
            kubectl -n taskmanager rollout status deploy/backend --timeout=180s
            exit 1
          fi
          kubectl -n taskmanager rollout status deploy/frontend --timeout=120s

      - name: Report
        run: |
          echo "### Deployed \`${{ needs.publish.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          kubectl -n taskmanager get deploy -o wide >> "$GITHUB_STEP_SUMMARY"
